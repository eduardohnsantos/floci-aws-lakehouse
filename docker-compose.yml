
services:
  floci:
    image: floci/floci:latest
    container_name: lakehouse-floci
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
    user: root
    restart: unless-stopped